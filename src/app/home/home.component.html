
<div class="content">
  <h1>Lista de Álbumes</h1>

  <div class="albums-table">
    <table mat-table [dataSource]="albums" class="mat-elevation-z8">
      
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let album" (click)="openDialog(album)">
          {{ album.nombre }}
        </td>
      </ng-container>

      <ng-container matColumnDef="artista">
        <th mat-header-cell *matHeaderCellDef>Artista</th>
        <td mat-cell *matCellDef="let album" (click)="openDialog(album)">
          {{ album.artista }}
        </td>
      </ng-container>

      <ng-container matColumnDef="genero">
        <th mat-header-cell *matHeaderCellDef>Género</th>
        <td mat-cell *matCellDef="let album" (click)="openDialog(album)">
          {{ album.genero }}
        </td>
      </ng-container>

      <ng-container matColumnDef="f_Lanzamiento">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let album" (click)="openDialog(album)">
          {{ album.f_Lanzamiento | date }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <div class="albums-by-genre">
    <app-hijo [albums]="albums" [GeneroList]="generos"></app-hijo>
  </div>
</div>
