<mat-dialog-content>
    <h2>{{ data.nombre }}</h2>
    <p><strong>Artista:</strong> {{ data.artista }}</p>
    <p><strong>Género:</strong> {{ data.genero }}</p>
    <p><strong>Fecha:</strong> {{ data.f_Lanzamiento | date: 'dd/MM/yyyy' }}</p>
  
    <div class="album-image-container">
      <img [src]="data.imagen" alt="{{ data.nombre }}" />
    </div>
  </mat-dialog-content>
  
  <mat-dialog-actions>
    <button mat-button (click)="closeDialog()">Cerrar</button>
  </mat-dialog-actions>
